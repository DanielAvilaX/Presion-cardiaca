<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Configura tu perfil, cambia tu contraseña y exporta tus mediciones de tensión arterial." />

    <title>Configuración — Tensión</title>

    <meta name="theme-color" content="#eef4f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1114" media="(prefers-color-scheme: dark)" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tensión" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <script>
      (function () {
        try {
          var t = localStorage.getItem("tension-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>

    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>

    <script type="module" src="./src/settingsApp.js"></script>
  </body>
</html>
